name: Release

# Ausgeloest durch einen Tag der Form v0.4.1. Der Workflow baut das Archiv,
# erzeugt die update.json fuer den eingebauten Updater und haengt beides an ein
# GitHub-Release. Ein Tag mit Bindestrich wie v0.5.0-beta.1 wird als
# Vorabversion veroeffentlicht und nie zum neuesten Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      SLUG: unternehmensdaten

    # Die Actions sind an Commits gebunden, nicht an Tags. Ein Tag laesst sich
    # nachtraeglich verschieben, und dieser Workflow baut das Archiv, das jede
    # Kundenseite installiert. Der Kommentar hinter dem Hash nennt die Fassung.
    steps:
      - name: Repository holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Der Workflow schreibt nie ins Repository zurueck.
          persist-credentials: false

      - name: PHP bereitstellen
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          # Die aelteste unterstuetzte Version. Syntax, die erst neuere
          # PHP-Versionen kennen, faellt so vor der Auslieferung auf.
          php-version: '7.4'
          coverage: none

      - name: Versionen abgleichen
        id: version
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME#v}"

          # Nur eine Versionsnummer, wie sie auch der Updater annimmt. Das steht
          # am Anfang, damit kein anderer Inhalt eines Tags weiterverarbeitet
          # oder ausgegeben wird.
          if [[ ! "$TAG" =~ ^[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z_.]+)?$ ]]; then
            echo "::error::Der Tag ist keine gültige Versionsnummer."
            exit 1
          fi

          HEADER=$(grep -m1 -E '^\s*\*\s*Version:' "$SLUG.php" | sed -E 's/.*Version:[[:space:]]*//' | tr -d '\r' | xargs)
          STABLE=$(grep -m1 '^Stable tag:' readme.txt | sed -E 's/^Stable tag:[[:space:]]*//' | tr -d '\r' | xargs)

          echo "Tag: $TAG | Header: $HEADER | Stable tag: $STABLE"

          # Auseinanderlaufende Nummern sind die haeufigste Ursache dafuer, dass
          # ein Update angeboten wird, das sich danach nicht als neu erkennt.
          if [ "$HEADER" != "$TAG" ]; then
            echo "::error::Tag $TAG und Version im Plugin-Header $HEADER stimmen nicht überein."
            exit 1
          fi

          if [ "$STABLE" != "$TAG" ]; then
            echo "::error::Tag $TAG und Stable tag in der readme.txt $STABLE stimmen nicht überein."
            exit 1
          fi

          # Ein Bindestrich kennzeichnet eine Vorabversion.
          case "$TAG" in
            *-*) PRERELEASE=true ;;
            *) PRERELEASE=false ;;
          esac

          {
            echo "version=$TAG"
            echo "prerelease=$PRERELEASE"
            echo "requires=$(grep -m1 '^Requires at least:' readme.txt | sed -E 's/^[^:]+:[[:space:]]*//' | tr -d '\r' | xargs)"
            echo "tested=$(grep -m1 '^Tested up to:' readme.txt | sed -E 's/^[^:]+:[[:space:]]*//' | tr -d '\r' | xargs)"
            echo "php=$(grep -m1 '^Requires PHP:' readme.txt | sed -E 's/^[^:]+:[[:space:]]*//' | tr -d '\r' | xargs)"
          } >> "$GITHUB_OUTPUT"

      - name: PHP-Dateien auf Syntaxfehler prüfen
        run: |
          set -euo pipefail
          php -r 'echo "PHP ", PHP_VERSION, PHP_EOL;'
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null
          echo "Alle PHP-Dateien sind syntaktisch fehlerfrei."

      - name: Archiv bauen
        run: |
          set -euo pipefail

          mkdir -p build/"$SLUG"

          # Alles ausser Entwicklungsballast in den Plugin-Ordner spiegeln.
          rsync -a ./ build/"$SLUG"/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            --exclude '.gitattributes' \
            --exclude 'build' \
            --exclude 'dev' \
            --exclude 'node_modules' \
            --exclude '*.zip' \
            --exclude 'update.json' \
            --exclude 'build.ps1'

          ( cd build && zip -rq "../$SLUG.zip" "$SLUG" )

          # Ohne den umschliessenden Ordner macht WordPress beim Aktualisieren
          # ein zweites, unabhaengiges Plugin daraus.
          unzip -l "$SLUG.zip" | grep -q " $SLUG/$SLUG.php$" \
            || { echo "::error::Im Archiv fehlt $SLUG/$SLUG.php"; exit 1; }

          unzip -l "$SLUG.zip" | tail -n 3

      - name: Änderungen aus der readme.txt lesen
        env:
          # Werte aus vorigen Schritten nur ueber die Umgebung: direkt ins Skript
          # eingesetzt, wuerden sie als Shell-Code gelesen.
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # Den Abschnitt "= 0.4.1 =" bis zur naechsten Ueberschrift herausziehen.
          # Als Datei, nicht als Ausgabewert: mehrzeilige Werte in YAML-Eingaben
          # und Shell-Aufrufen zu interpolieren geht regelmaessig schief.
          awk -v ver="= $VERSION =" '
            $0 == ver { found = 1; next }
            found && /^= .* =$/ { exit }
            found { print }
          ' readme.txt | sed '/^[[:space:]]*$/d' > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::In der readme.txt fehlt ein Changelog-Abschnitt für $VERSION."
            exit 1
          fi

          cat release-notes.md

      - name: update.json erzeugen
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REQUIRES: ${{ steps.version.outputs.requires }}
          TESTED: ${{ steps.version.outputs.tested }}
          PHP_MIN: ${{ steps.version.outputs.php }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Die Notizen als HTML fuer das Detailfenster von WordPress. Zuerst
          # maskieren, damit ein kaufmaennisches Und die Auszeichnung nicht bricht.
          sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' release-notes.md \
            | sed -E 's|^\* (.*)$|<li>\1</li>|' \
            > notes.html

          {
            echo "<h4>$VERSION</h4>"
            echo "<ul>"
            grep '^<li>' notes.html || true
            echo "</ul>"
            grep -v '^<li>' notes.html | sed -E 's|^(.+)$|<p>\1</p>|' || true
          } > changelog.html

          jq -n \
            --arg version   "$VERSION" \
            --arg slug      "$SLUG" \
            --arg repo      "$REPO" \
            --arg requires  "$REQUIRES" \
            --arg tested    "$TESTED" \
            --arg php       "$PHP_MIN" \
            --arg updated   "$(date -u '+%Y-%m-%d %H:%M:%S')" \
            --rawfile changelog changelog.html \
            '{
              name: "Unternehmensdaten",
              slug: $slug,
              version: $version,
              homepage: ("https://github.com/" + $repo),
              requires: $requires,
              tested: $tested,
              requires_php: $php,
              last_updated: $updated,
              download_url: ("https://github.com/" + $repo + "/releases/download/v" + $version + "/" + $slug + ".zip"),
              sections: {
                description: "Zentrale Verwaltung aller rechtlich erforderlichen Unternehmensangaben mit Shortcodes, Inhaltsbereichen und strukturierten Daten.",
                changelog: $changelog
              }
            }' > update.json

          # Nachpruefen, dass gueltiges JSON entstanden ist.
          jq empty update.json
          cat update.json

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: "Version ${{ steps.version.outputs.version }}"
          body_path: release-notes.md
          # Eine Vorabversion wird nie zum neuesten Release, denn dorthin zeigt
          # releases/latest/download/update.json, das alle Kundenseiten abfragen.
          # legacy macht ein Release nur dann zum neuesten, wenn es auch die
          # hoechste Versionsnummer traegt, also nicht bei einem Nachtrag zu
          # einer aelteren Fassung.
          prerelease: ${{ steps.version.outputs.prerelease }}
          make_latest: ${{ steps.version.outputs.prerelease == 'true' && 'false' || 'legacy' }}
          files: |
            unternehmensdaten.zip
            update.json
